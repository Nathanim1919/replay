version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: replay-postgres
    environment:
      POSTGRES_USER: replay
      POSTGRES_PASSWORD: replay_secret_password
      POSTGRES_DB: replay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: replay-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: always

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: replay-server
    environment:
      PORT: "8080"
      DB_DRIVER: "postgres"
      DATABASE_URL: "postgres://replay:replay_secret_password@postgres:5432/replay?sslmode=disable"
      BLOB_STORAGE: "s3"
      AWS_S3_BUCKET: "recordings"
      AWS_ENDPOINT: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadminpassword"
      JWT_SECRET: "production_super_secret_jwt_key_replay"
      WEB_URL: "https://replay.nathanim.dev"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: replay-web
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: always

volumes:
  pgdata:
  miniodata:

